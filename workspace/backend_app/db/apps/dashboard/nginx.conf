events {
  worker_connections  1024;  ## Default: 1024
}

http {
  include    mime.types;
  server {
    listen          80;
    root            /app;
#     location ^~ /assets/ {
#         try_files $uri =404;
#     }

    location ^~ {
            index index.html;
            try_files $uri.html $uri $uri/ /index.html;
    }
  }
}